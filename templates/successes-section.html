<div class="section success-section" id="section-success-{{cat_key}}">
    <div class="section-header" onclick="toggleSection('section-success-{{cat_key}}')">
        <span class="section-icon">{{icon}}</span>
        <h2><span class="badge badge-success">✅</span> {{category}} <span class="success-count">{{count}}</span> {{i18n_validation_count}}</h2>
        <span class="chevron">▶</span>
    </div>
    <div class="section-content">
        {{items}}
    </div>
</div>
