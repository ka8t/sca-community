<div class="category-group" data-category="{{category_key}}">
    <div class="category-group-header" onclick="this.parentElement.classList.toggle('open')">
        <span class="category-group-icon">{{icon}}</span>
        <h4>{{title}}</h4>
        <span class="category-group-badge">{{count}}</span>
        <span class="category-group-chevron">▶</span>
    </div>
    <div class="category-group-content">
        {{content}}
    </div>
</div>
