<div class="rule-group">
    <div class="rule-group-header" onclick="this.parentElement.classList.toggle('open')">
        <span class="rule-group-name">{{rule_name}}</span>
        <span class="rule-group-badge">{{count}}</span>
        <span class="rule-group-chevron">▶</span>
    </div>
    <div class="rule-group-content">
        {{content}}
    </div>
</div>
